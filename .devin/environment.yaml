setup:
  - name: Install dependencies
    run: npm ci

  - name: Build the compiler
    run: npx hereby local

  - name: Build the test infrastructure
    run: npx hereby tests

maintenance:
  - name: Reinstall dependencies
    run: npm ci

  - name: Rebuild the compiler
    run: npx hereby local

  - name: Rebuild test infrastructure
    run: npx hereby tests

knowledge:
  - name: Build system
    contents: >
      The TypeScript compiler repo uses "hereby" as its build/task runner
      (defined in Herebyfile.mjs). The main build command is "hereby local"
      which compiles the compiler into built/local/. Test infrastructure is
      built separately with "hereby tests".

  - name: Running tests
    contents: >
      Use "hereby runtests --tests=<regex>" to run a specific subset of tests,
      or "hereby runtests-parallel" to run the full test suite across multiple
      threads. Valid test runners include conformance, compiler, fourslash, and
      project. Test cases live under tests/cases/.

  - name: Node.js version
    contents: >
      The repo specifies Node 20.1.0 and npm 8.19.4 via Volta in package.json,
      but builds and tests pass successfully with Node 22.x and npm 10.x as well.
      The minimum engine requirement is Node >=14.17.

  - name: Linting
    contents: >
      Run "hereby lint" to lint the TypeScript source with ESLint. The config
      is in eslint.config.mjs. Formatting is handled by dprint ("npm run format").

  - name: Diagnostics generation
    contents: >
      If you modify src/compiler/diagnosticMessages.json, run
      "hereby generate-diagnostics" to regenerate the Diagnostic interface
      in diagnosticInformationMap.generated.ts.

  - name: Baseline tests
    contents: >
      Most compiler tests produce baseline output files. When baselines change,
      tests will fail. Inspect changes with
      "git diff --diff-filter=AM --no-index ./tests/baselines/reference ./tests/baselines/local"
      and accept them with "hereby baseline-accept".
